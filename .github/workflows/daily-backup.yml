name: Daily Data Backup

on:
  schedule:
    # 每天 UTC 06:00 (北京时间 14:00)
    - cron: '0 6 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read

concurrency:
  group: daily-data-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Run backup script
        run: node scripts/backup-data.js
          
      - name: Upload backup snapshot
        uses: actions/upload-artifact@v4
        with:
          name: data-backup-${{ github.run_id }}
          path: data/*.json
          retention-days: 14
          if-no-files-found: error
