name: Fetch WeChat Reading Data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-weread.yml'
      - 'scripts/fetch-weread-public.py'
  schedule:
    - cron: '5 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collector-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  fetch-weread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch official public bookshelf
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: python3 scripts/fetch-weread-public.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weread.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update public WeRead snapshot [skip ci]"
            bash scripts/push-data-update.sh
          fi
