name: Update Site Index
on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'files/**'
      - 'scripts/build-site-index.py'
      - '.github/workflows/update-site-index.yml'
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-index-generation
  cancel-in-progress: false
jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Regenerate and publish against current main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # Only resets this disposable CI checkout, never the remote branch.
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/build-site-index.py
            rm -rf pagefind
            npx -y pagefind --site . --output-path pagefind --glob "blog/**/*.html"
            git add -- data/blog-index.json data/files-index.json data/stats.json sitemap.xml feed.xml pagefind/
            if git diff --cached --quiet; then
              echo "No index changes."
              exit 0
            fi
            git commit -m "chore: update site index, sitemap, RSS feed, and search index [skip ci]"
            if git push origin HEAD:main; then
              echo "Index generated and pushed successfully." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo "::error::Index update could not push after five fresh rebuilds"
          exit 1
