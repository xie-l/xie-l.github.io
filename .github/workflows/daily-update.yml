name: 每日数据自动更新

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-update.yml'
  schedule:
    # 每天北京时间 08:13 运行 (UTC 00:13)
    - cron: '13 0 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

concurrency:
  group: collector-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-daily-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成每日内容
        run: python scripts/archive/daily_update.py

      - name: 检查是否有更新
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "没有数据更新"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "检测到数据更新"
          fi

      - name: 提交更新
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/daily-data.json data/daily-keywords.json data/daily-questions.json data/stats.json
          git commit -m "chore: 自动更新每日数据
          
          - 更新今日三问
          - 更新每日五词
          - 更新今日数感
          - 更新时间戳"
          bash scripts/push-data-update.sh

      - name: 更新成功通知
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "✅ 每日数据更新成功！"
          echo "更新时间: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 无需更新
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "ℹ️ 暂无数据更新，跳过提交"
