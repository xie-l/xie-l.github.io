name: Deploy Public Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */3 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: custom-public-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: bash scripts/build-public-site.sh _site
      - name: Validate snapshot JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('_site/data').glob('*.json'):
              with path.open(encoding='utf-8') as f:
                  json.load(f)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Allow artifact metadata to propagate
        run: sleep 15
      - uses: actions/deploy-pages@v4
        id: deployment
