name: Deploy Public Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 */3 * * *'
  workflow_run:
    workflows:
      - Fetch News Feeds
      - Fetch Weather Data
      - Fetch Energy Market Data
      - Fetch Academic Stats
      - Fetch WeChat Reading Data
      - 每日数据自动更新
      - Sync Obsidian to Blog
      - Update Site Index
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: custom-public-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: bash scripts/build-public-site.sh _site
      - name: Validate snapshot JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('_site/data').glob('*.json'):
              with path.open(encoding='utf-8') as f:
                  json.load(f)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Allow artifact metadata to propagate
        run: sleep 10
      - uses: actions/deploy-pages@v4
        id: deployment
