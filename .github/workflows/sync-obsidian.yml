name: Sync Obsidian to Blog

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      sync_type:
        description: '同步类型'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - full-sync
      
  # 当 obsidian-vault 目录有变更时自动触发
  push:
    branches:
      - main
      - master
    paths:
      - 'obsidian-vault/**/*.md'
      - 'obsidian-vault/attachments/**'
      - 'config/obsidian-sync.config.json'
  
  # 定时触发（每天凌晨3点）
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: collector-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-obsidian:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run dry-run sync
        if: github.event.inputs.sync_type == 'dry-run' || github.event_name == 'push'
        run: npm run sync:obsidian:dry-run
      
      - name: Require explicitly published vault input
        if: github.event.inputs.sync_type == 'full-sync' || github.event_name == 'schedule' || github.event_name == 'push'
        run: |
          if ! test -d obsidian-vault || ! find obsidian-vault -type f -name '*.md' -print -quit | grep -q .; then
            echo "::error::No Obsidian input files available. Use a private vault and publish only approved notes."
            exit 1
          fi
      - name: Run full sync
        if: github.event.inputs.sync_type == 'full-sync' || github.event_name == 'schedule' || github.event_name == 'push'
        run: npm run sync:obsidian
      
      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.changes.outputs.changes == 'true' && (github.event.inputs.sync_type == 'full-sync' || github.event_name == 'schedule' || github.event_name == 'push')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -- blog/ img/ files/ data/
          git diff --cached --quiet && exit 0
          git commit -m "Auto-sync Obsidian files [$(date +'%Y-%m-%d %H:%M:%S')]"
          bash scripts/push-data-update.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload sync logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs-${{ github.run_number }}
          path: logs/obsidian-sync-*.log
          retention-days: 7
      
      - name: Sync summary
        run: |
          echo "## Obsidian Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Sync Type**: ${{ github.event.inputs.sync_type || 'auto' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ -f logs/obsidian-sync-*.log ]]; then
            echo "### Sync Log" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -50 logs/obsidian-sync-*.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
