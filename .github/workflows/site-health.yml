name: Site Health and Alerts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-health.yml'
      - 'scripts/validate-site.py'
  schedule:
    - cron: '51 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: read
concurrency:
  group: site-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate source syntax
        run: python3 scripts/validate-site.py
      - name: Report data quality and site availability
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_SMTP_ALERTS: ${{ github.event_name == 'schedule' && vars.ENABLE_SMTP_ALERTS == 'true' }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python3 scripts/check-site-health.py
      - name: Save health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-health-${{ github.run_id }}
          path: site-health-report.json
          if-no-files-found: warn
          retention-days: 14
